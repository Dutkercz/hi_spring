
spring:
  application:
    name: hi
  profiles:
    active: "mysql"
  datasource:
    url: "jdbc:mysql://${MYSQLUSER}:${MYSQL_ROOT_PASSWORD}@${RAILWAY_TCP_PROXY_DOMAIN}:${RAILWAY_TCP_PROXY_PORT}/${MYSQL_DATABASE}"
    username: "${MYSQLUSER}"
    password: "${MYSQL_ROOT_PASSWORD}"
resilience4j:
  ratelimiter:
    instances:
      backendApi:
        limit-for-period: 10 #numero de requests permitidos
        limit-refresh-period: 60s #tempo até o refresh dos tokens
        timeout-duration: 0s #tempo em que a trhead espera a disponibilidade de tokens antes de falhar
server:
  port: ${PORT:8080}