# fly.toml app configuration file generated for hi-spring on 2026-10-15T17:42:11Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hi-spring'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
